services:
  alert-bridge:
    build: .
    ports:
      - "9999:9999"
    env_file:
      - .env
    volumes:
      - ./config/routing.yml:/app/config/routing.yml
    restart: unless-stopped
  
  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - alert-bridge
    restart: unless-stopped