services:
  alert-bridge:
    build: .
    expose:
      - "9999"
    env_file:
      - .env
    restart: unless-stopped
  
  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - alert-bridge
    restart: unless-stopped
